<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<title>Reset password · FinOps</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="dashboard.css" />
<style>
  /* This page is a single centered panel, not the full dashboard shell -
     it's reached logged-out, before there's anything else to show. */
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .recovery-wrap { width: 100%; max-width: 380px; }
  .recovery-brand { text-align: center; margin-bottom: 18px; }
  .recovery-brand h1 { font-size: 18px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.01em; }
  .recovery-brand .sub { color: var(--text-muted); font-size: 12.5px; }
  .recovery-msg { font-size: 12.5px; margin-top: 10px; line-height: 1.5; }
  .recovery-msg.error { color: var(--danger); }
  .recovery-msg.ok { color: var(--good); }
  .recovery-back { display: block; text-align: center; margin-top: 16px; color: var(--text-muted); font-size: 12.5px; text-decoration: none; }
  .recovery-back:hover { color: var(--text); }
  input[type="password"], input[type="text"] { margin-bottom: 10px; }
</style>
</head>
<body>

  <div class="recovery-wrap">
    <div class="recovery-brand">
      <h1>FinOps</h1>
      <span class="sub">Account recovery</span>
    </div>

    <!-- Request state: no token in the URL yet - ask for a username, send a
         reset link. Shown/hidden by script below depending on ?token=. -->
    <div class="panel" id="requestPanel">
      <h2 class="panel-title">Reset your password</h2>
      <div class="tick-rule"></div>
      <div style="color:var(--text-muted);font-size:12px;margin-bottom:8px;">
        Enter your username and, if that account has an email on file, we'll send a reset link.
      </div>
      <input id="requestUsername" type="text" placeholder="username" autocomplete="username" />
      <button id="requestBtn" class="primary" style="width:100%;">Send reset link</button>
      <div id="requestMsg" class="recovery-msg"></div>
    </div>

    <!-- Redeem state: ?token=... is present - set a new password. -->
    <div class="panel" id="redeemPanel" style="display:none;">
      <h2 class="panel-title">Set a new password</h2>
      <div class="tick-rule"></div>
      <input id="newPassword" type="password" placeholder="new password (min 8 characters)" autocomplete="new-password" />
      <input id="confirmPassword" type="password" placeholder="confirm new password" autocomplete="new-password" />
      <button id="redeemBtn" class="primary" style="width:100%;">Set password</button>
      <div id="redeemMsg" class="recovery-msg"></div>
    </div>

    <a class="recovery-back" href="index.html">&larr; Back to dashboard</a>
  </div>

<script>
  const GENERIC_QUEUED_MESSAGE = "If an account matching that request exists, an email has been sent.";
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  const requestPanel = document.getElementById("requestPanel");
  const redeemPanel = document.getElementById("redeemPanel");

  async function postJson(path, body) {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    let json = {};
    try { json = await res.json(); } catch {}
    return { ok: res.ok, status: res.status, json };
  }

  function setMsg(el, text, kind) {
    el.textContent = text;
    el.className = "recovery-msg" + (kind ? " " + kind : "");
  }

  if (token) {
    requestPanel.style.display = "none";
    redeemPanel.style.display = "";

    document.getElementById("redeemBtn").addEventListener("click", async () => {
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const msg = document.getElementById("redeemMsg");
      if (newPassword.length < 8) {
        setMsg(msg, "Password must be at least 8 characters.", "error");
        return;
      }
      if (newPassword !== confirmPassword) {
        setMsg(msg, "Passwords don't match.", "error");
        return;
      }
      setMsg(msg, "Setting new password…");
      const { ok, json } = await postJson("/api/auth/reset-password", { token, newPassword });
      if (ok) {
        setMsg(msg, "Password updated. You can log in with your new password now.", "ok");
        document.getElementById("redeemBtn").disabled = true;
      } else {
        setMsg(msg, json.error || "That reset link is invalid or has expired. Request a new one below.", "error");
        // Fall back to letting them request a fresh link without reloading.
        redeemPanel.style.display = "none";
        requestPanel.style.display = "";
      }
    });
  } else {
    document.getElementById("requestBtn").addEventListener("click", async () => {
      const username = document.getElementById("requestUsername").value.trim();
      const msg = document.getElementById("requestMsg");
      if (!username) {
        setMsg(msg, "Enter your username.", "error");
        return;
      }
      setMsg(msg, "Sending…");
      const { ok, json } = await postJson("/api/auth/forgot-password", { username });
      // Always show the same generic message, success or not - see
      // routes/auth.js's own comment on why the response must never reveal
      // whether the username or email exists.
      setMsg(msg, ok ? (json.message || GENERIC_QUEUED_MESSAGE) : (json.error || "Something went wrong. Try again shortly."), ok ? "ok" : "error");
    });
  }
</script>

</body>
</html>
